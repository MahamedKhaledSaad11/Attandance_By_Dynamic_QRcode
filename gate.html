<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>...</title>
  <style>
    :root {
      --bg-primary: #0a0f1d;
      --bg-card: #131b2e;
      --accent-red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 50px 40px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 260px;
    }

    /* علامة الحظر النقية */
    .block-icon-wrapper {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(239, 68, 68, 0.12);
      border: 3px solid var(--accent-red);
      box-shadow: 0 0 35px rgba(239, 68, 68, 0.4);
      animation: pulse 2s infinite ease-in-out;
    }

    .block-svg {
      width: 58px;
      height: 58px;
      fill: var(--accent-red);
    }

    /* مؤشر تحميل بسيط وسريع جداً للتحويل اللحظي */
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #00f2fe;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0% { transform: scale(0.96); opacity: 0.85; }
      50% { transform: scale(1.04); opacity: 1; }
      100% { transform: scale(0.96); opacity: 0.85; }
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <!-- حالة الفحص السريع أثناء التحويل -->
    <div id="loadingState">
      <div class="spinner"></div>
    </div>

    <!-- حالة الحظر فقط (أيقونة الحظر فقط بدون أي نص أو تفاصيل مؤقت) -->
    <div id="blockedState" class="hidden">
      <div class="block-icon-wrapper">
        <svg class="block-svg" viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8 0-1.85.63-3.55 1.69-4.9L16.9 18.31C15.55 19.37 13.85 20 12 20zm5.31-3.1L6.1 5.69C7.45 4.63 9.15 4 12 4c4.42 0 8 3.58 8 8 0 1.85-.63 3.55-1.69 4.9z"/>
        </svg>
      </div>
    </div>
  </div>

  <script>
    // نافذة السماح الافتراضية (8 ثوانٍ: 5 ثوانٍ للكود + 3 ثوانٍ لسماحية استجابة الشبكة والكاميرا)
    const DEFAULT_ALLOWED_WINDOW = 8;

    async function verifyAndRedirect() {
      const urlParams = new URLSearchParams(window.location.search);
      const targetUrl = urlParams.get('url');
      const timestampStr = urlParams.get('t');
      const windowStr = urlParams.get('w');

      const loadingEl = document.getElementById('loadingState');
      const blockedEl = document.getElementById('blockedState');

      // إذا كانت المعلمات مفقودة أو غير صالحة
      if (!targetUrl || !timestampStr) {
        loadingEl.classList.add('hidden');
        blockedEl.classList.remove('hidden');
        return;
      }

      // تحديد مدة الصلاحية المسموحة (إذا حددها البرنامج نستخدمها، وإلا الافتراضي)
      let allowedWindow = DEFAULT_ALLOWED_WINDOW;
      if (windowStr) {
        const parsedWindow = parseInt(windowStr, 10);
        if (!isNaN(parsedWindow) && parsedWindow > 0) {
          allowedWindow = parsedWindow;
        }
      }

      const generatedTime = parseInt(timestampStr, 10);
      const currentTime = Date.now();
      const elapsedSeconds = Math.floor((currentTime - generatedTime) / 1000);

      // إذا انتهت الصلاحية (تم تصوير الشاشة وتأخر أكثر من المدة المسموحة):
      // نتحقق أيضاً من ألا يكون التاريخ قادماً من المستقبل بفارق غير منطقي (سماحية 60 ثانية لفرق التوقيت بين الأجهزة)
      if (isNaN(generatedTime) || elapsedSeconds > allowedWindow || elapsedSeconds < -60) {
        loadingEl.classList.add('hidden');
        blockedEl.classList.remove('hidden');
        return;
      }

      // إذا كان الكود حديثاً (تم المسح في الحال):
      // فك التشفير والتحويل الفوري لـ Google Form
      let decodedUrl = '';
      try {
        decodedUrl = decodeURIComponent(atob(targetUrl));
      } catch (e1) {
        try {
          decodedUrl = decodeURIComponent(targetUrl);
        } catch (e2) {
          decodedUrl = targetUrl;
        }
      }

      // التحقق من صحة الرابط وأنه بروتوكول ويب آمن
      if (!decodedUrl || (!decodedUrl.startsWith('http://') && !decodedUrl.startsWith('https://'))) {
        loadingEl.classList.add('hidden');
        blockedEl.classList.remove('hidden');
        return;
      }

      window.location.replace(decodedUrl);
    }

    verifyAndRedirect();
  </script>
</body>
</html>
